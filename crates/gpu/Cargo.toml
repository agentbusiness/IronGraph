[package]
name = "irongraph-gpu"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
publish = false

[features]
default = ["accelerator"]
accelerator = ["dep:candle-core", "dep:candle-metal-kernels", "dep:objc2-metal", "irongraph-graph/accelerator"]
metal = ["accelerator"]
cuda = ["accelerator", "candle-core/cuda"]

[dependencies]
irongraph-types = { path = "../types" }
irongraph-execution = { path = "../execution" }
irongraph-graph = { path = "../graph" }
blake3 = { workspace = true }
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
half = { version = "2.7.1", features = ["serde"] }
ordered-float = { version = "5.1.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
parking_lot = "0.12.5"
tokio-util = { version = "0.7.18", features = ["rt"] }
uuid = { version = "1.19.0", features = ["serde", "v4", "v7"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
candle-core = { workspace = true, optional = true, features = ["metal"] }
candle-metal-kernels = { version = "0.11.0", optional = true }
objc2-metal = { version = "0.3.2", optional = true }

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
candle-core = { workspace = true, optional = true }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
