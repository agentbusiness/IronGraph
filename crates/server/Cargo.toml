[package]
name = "irongraph-server"
version = "0.1.2"
edition = "2024"
rust-version = "1.94"
publish = false

[features]
default = ["accelerator"]
# The write path applies directly to one local backend.
accelerator = ["dep:candle-core", "irongraph-embedding/accelerator", "irongraph-graph/accelerator", "irongraph-gpu/accelerator"]
metal = ["accelerator"]
cuda = ["accelerator", "candle-core/cuda", "irongraph-gpu/cuda"]

[dependencies]
irongraph-types = { path = "../types" }
irongraph-cypher = { path = "../cypher" }
irongraph-storage = { path = "../storage" }
irongraph-execution = { path = "../execution" }
irongraph-graph = { path = "../graph" }
irongraph-gpu = { path = "../gpu", default-features = false }
irongraph-embedding = { path = "../embedding", default-features = false }
anyhow = "1.0.100"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["http2", "json", "macros", "tokio"] }
bitflags = { version = "2.10.0", features = ["serde"] }
bitvec = { version = "1.0.1", features = ["serde"] }
blake3 = { workspace = true }
bytes = { version = "1.11.0", features = ["serde"] }
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
csv = "1.4.0"
ciborium = "0.2.2"
clap = { version = "4.5.54", features = ["derive", "env"] }
crc32c = "0.6.8"
crc32fast = "1.5.0"
ed25519-dalek = { version = "2.2.0", features = ["pkcs8", "rand_core", "serde", "zeroize"] }
flate2 = "1.1.5"
futures = "0.3.31"
half = { version = "2.7.1", features = ["serde"] }
hex = "0.4.3"
http = "1.4.0"
lz4_flex = "0.12.0"
ordered-float = { version = "5.1.0", features = ["serde"] }
parking_lot = { version = "0.12.5", features = ["serde"] }
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
rand = "0.9.2"
rayon = "1.12.0"
rcgen = { version = "0.14.5", features = ["aws_lc_rs", "pem", "x509-parser"] }
rust-embed = { version = "8.11.0", features = ["compression", "include-exclude"] }
rustls = { version = "0.23.35", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
sha2 = { workspace = true }
snap = "1.1.1"
tar = "0.4.44"
tokio = { version = "1.49.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26.4"
tokio-stream = { version = "0.1.17", features = ["net", "sync"] }
tokio-util = { version = "0.7.18", features = ["codec", "io", "rt"] }
tower = { version = "0.5.2", features = ["balance", "buffer", "discover", "limit", "load-shed", "retry", "timeout", "util"] }
tracing = "0.1.44"
ulid = { version = "1.2.1", features = ["serde"] }
uuid = { version = "1.19.0", features = ["serde", "v4", "v7"] }
x509-parser = "0.18.1"
zeroize = { version = "1.8.2", features = ["serde"] }
zstd = "0.13.3"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
candle-core = { workspace = true, optional = true, features = ["metal"] }

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
candle-core = { workspace = true, optional = true }

[dev-dependencies]
criterion = { version = "0.7.0", features = ["async_tokio", "html_reports"] }
# Real clients for the Stream and Queue wire surfaces. `rdkafka` vendors and builds the actual
# librdkafka, which is what backs the Python, Go, Node, and .NET Kafka clients, and `lapin` is a
# pure-Rust AMQP 0-9-1 client. Both build from cargo with no external services, so the interop
# gates run in CI rather than being manual steps nobody performs.
lapin = "3.7.0"
proptest = "1.9.0"
rdkafka = { version = "0.38.0", features = ["cmake-build"] }
tempfile = "3.24.0"
tokio-test = "0.4.4"
