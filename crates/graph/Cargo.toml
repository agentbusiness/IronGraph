[package]
name = "irongraph-graph"
version = "0.1.3"
edition = "2024"
rust-version = "1.94"
publish = false

[features]
default = []
accelerator = []

[dependencies]
blake3 = { workspace = true }
bitflags = { version = "2.10.0", features = ["serde"] }
bitvec = { version = "1.0.1", features = ["serde"] }
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
irongraph-types = { path = "../types" }
half = { version = "2.7.1", features = ["serde"] }
ordered-float = { version = "5.1.0", features = ["serde"] }
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
roaring = { version = "0.11.2", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
unicode-normalization = "0.1.25"
uuid = { version = "1.19.0", features = ["serde", "v4", "v7"] }

[dev-dependencies]
ciborium = "0.2.2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
