[package]
name = "irongraph-cypher"
version = "0.1.2"
edition = "2024"
rust-version = "1.94"
publish = false

[features]
default = ["accelerator"]
accelerator = ["irongraph-graph/accelerator"]

[dependencies]
irongraph-types = { path = "../types" }
irongraph-execution = { path = "../execution" }
irongraph-graph = { path = "../graph" }
blake3 = { workspace = true }
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
ordered-float = { version = "5.1.0", features = ["serde"] }
hex = "0.4.3"
rand = "0.9.2"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive", "rc"] }
smallvec = { version = "1.15.1", features = ["serde", "union", "const_generics"] }
stacker = "0.1.24"
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
uuid = { version = "1.19.0", features = ["serde", "v4", "v7"] }

[dev-dependencies]
proptest = "1.9.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
