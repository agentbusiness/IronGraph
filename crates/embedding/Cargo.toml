[package]
name = "irongraph-embedding"
version = "0.1.13"
edition = "2024"
rust-version = "1.94"
publish = false

[features]
default = ["accelerator"]
# Automatic local text-embedding runtime.
accelerator = ["dep:candle-core", "dep:candle-nn", "dep:irongraph-artifact-loader", "dep:tokenizers", "irongraph-graph/accelerator", "irongraph-gpu/accelerator"]
metal = ["accelerator"]
cuda = ["accelerator", "candle-core/cuda", "candle-nn/cuda", "dep:cudarc", "irongraph-gpu/cuda"]

[dependencies]
irongraph-types = { path = "../types" }
irongraph-execution = { path = "../execution" }
irongraph-graph = { path = "../graph" }
irongraph-gpu = { path = "../gpu", default-features = false }
blake3 = { workspace = true }
libc = { workspace = true }
memmap2 = { workspace = true }
parking_lot = { version = "0.12.5", features = ["serde"] }
rustls = { version = "0.23.35", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.149"
sha2 = { workspace = true }
tokio-util = { version = "0.7.20", features = ["codec", "io", "rt"] }
tracing = "0.1.44"
url = "2.5.8"
webpki-roots = "1.0.6"
irongraph-artifact-loader = { path = "../artifact-loader", optional = true }

tokenizers = { version = "0.22.2", optional = true, default-features = false, features = ["fancy-regex", "onig", "progressbar"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
candle-core = { workspace = true, optional = true, features = ["metal"] }
candle-nn = { workspace = true, optional = true, features = ["metal"] }

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
cudarc = { version = "0.19.8", optional = true, default-features = false, features = ["cuda-version-from-build-system", "dynamic-loading", "fallback-latest", "nvrtc"] }

[dev-dependencies]
tempfile = "3.24.0"
