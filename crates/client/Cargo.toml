[package]
name = "irongraph-client"
version = "0.1.12"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
chrono = "0.4.45"
irongraph-server = { path = "../server", default-features = false }
irongraph-types = { path = "../types" }
neo4j = "0.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
rustls = { version = "0.23.35", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
thiserror = { workspace = true }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["serde", "v4"] }

[dev-dependencies]
axum = { version = "0.8.9", features = ["json", "tokio"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread"] }
tokio-util = "0.7.20"
