[package]
name = "irongraph-storage"
version = "0.1.13"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
blake3 = { workspace = true }
irongraph-types = { path = "../types" }
hex = "0.4.3"
libc = { workspace = true }
parking_lot = "0.12.5"
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
redb = "=4.4.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
tempfile = "3.24.0"
uuid = { version = "1.29.0", features = ["serde", "v4", "v7"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
