[package]
name = "irongraph-embedded"
version = "0.1.12"
edition = "2024"
rust-version = "1.94"
publish = false

[features]
default = ["accelerator"]
accelerator = ["irongraph-server/accelerator"]
cuda = ["accelerator", "irongraph-server/cuda"]

[dependencies]
irongraph-client = { path = "../client" }
irongraph-server = { path = "../server", default-features = false }
irongraph-types = { path = "../types" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
thiserror = { workspace = true }
tracing = "0.1.44"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
tempfile = "3.27.0"
rdkafka = { version = "0.38.0", features = ["cmake-build"] }
