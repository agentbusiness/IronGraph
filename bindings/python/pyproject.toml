[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "irongraph"
version = "0.1.4"
description = "Embed a GPU-first graph database in Python with automatic local embeddings, Cypher, vector search, streaming, and queues."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE.txt", "THIRD_PARTY_NOTICES.txt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/agentbusiness/IronGraph"
Repository = "https://github.com/agentbusiness/IronGraph"
Issues = "https://github.com/agentbusiness/IronGraph/issues"

[tool.maturin]
module-name = "irongraph._native"
python-source = "python"
features = ["pyo3/extension-module", "pyo3/abi3-py39"]
strip = true

[tool.maturin.sbom]
# Native dependency notices are bundled separately.
rust = false
